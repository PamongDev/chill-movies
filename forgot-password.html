
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chill - Forgot Password</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <div class="page">

        <main class="auth-main">
            <section class="login-card">

                <!-- =========================
                     WELCOME PANEL
                ========================== -->
                <div class="login-welcome">
                    <div class="welcome-content">
                        <!-- Brand -->
                        <img
                            src="assets/images/main/logo only no bg.png"
                            alt="Chill"
                            class="welcome-logo"
                        >
                        <br>
                        <h1>
                            Welcome to
                            <span>Your Cinema</span>
                        </h1>
                        <p>
                            Your place to relax, discover,
                            and enjoy your favorite content.
                        </p>
                    </div>
                    <div class="welcome-footer">
                        <span>Relax. Watch. Enjoy.</span>
                    </div>

                </div>


                <!-- =========================
                     RESET PASSWORD FORM
                ========================== -->
                <div class="login-form-panel">

                    <div class="form-header">

                        <h2>
                            Reset password
                        </h2>

                        <p>
                            Enter the email associated with
                            your account.
                        </p>

                    </div>


                    <form
                        action="/forgot-password"
                        method="post"
                        class="login-form"
                    >

                        <!-- Email -->
                        <div class="form-group">

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                autocomplete="off"
                                required
                            >

                        </div>


                        <!-- Submit -->
                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Send reset link
                        </button>


                        <!-- Back to Login -->
                        <p class="register-text">

                            Remember your password?

                            <a href="login-page.html">
                                Back to login
                            </a>

                        </p>

                    </form>

                </div>

            </section>
        </main>


        <!-- FOOTER -->
        <footer class="auth-footer">

            <p>
                &copy; 2026 Chill. All rights reserved.
            </p>

        </footer>

    </div>
</body>
</html>
