<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chill Register</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <div class="page">

        <main class="auth-main">
            <section class="login-card">

                <!-- =========================
                     WELCOME PANEL
                ========================== -->
                <div class="login-welcome">
                    <div class="welcome-content">
                        <!-- Brand -->
                        <img
                            src="assets/images/logo only no bg.png"
                            alt="Chill"
                            class="welcome-logo"
                        >
                        <br>
                        <h1>
                            Welcome to
                            <span>Your Cinema</span>
                        </h1>
                        <p>
                            Your place to relax, discover,
                            and enjoy your favorite content.
                        </p>
                    </div>
                    <div class="welcome-footer">
                        <span>Relax. Watch. Enjoy.</span>
                    </div>

                </div>


                <!-- =========================
                     REGISTER FORM
                ========================== -->
                <div class="login-form-panel">

                    <div class="form-header">

                        <h2>
                            Create account
                        </h2>

                        <p>
                            Fill in your information to get started.
                        </p>

                    </div>


                    <form
                        action="/register"
                        method="post"
                        class="login-form"
                    >

                        <!-- Username -->
                        <div class="form-group">

                            <label for="username">
                                Username
                            </label>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Choose a username"
                                autocomplete="off"
                                required
                            >

                        </div>


                        <!-- Email -->
                        <div class="form-group">

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                autocomplete="off"
                                required
                            >

                        </div>


                        <!-- Password -->
                        <div class="form-group">

                            <label for="password">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Create a password"
                                autocomplete="new-password"
                                required
                            >

                        </div>


                        <!-- Confirm Password -->
                        <div class="form-group">

                            <label for="confirm-password">
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                id="confirm-password"
                                name="confirm_password"
                                placeholder="Repeat your password"
                                autocomplete="new-password"
                                required
                            >

                        </div>


                        <!-- Register -->
                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Create account
                        </button>


                        <!-- Login -->
                        <p class="register-text">

                            Already have an account?

                            <a href="login-page.html">
                                Sign in
                            </a>

                        </p>

                    </form>

                </div>

            </section>
        </main>


        <!-- FOOTER -->
        <footer class="auth-footer">

            <p>
                &copy; 2026 Chill. All rights reserved.
            </p>

        </footer>

    </div>
</body>
</html>
